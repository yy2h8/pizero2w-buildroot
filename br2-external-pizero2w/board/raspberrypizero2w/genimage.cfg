image boot.vfat {
    vfat {
        files = {
            "bcm2710-rpi-zero-2-w.dtb",
            "rpi-firmware/bootcode.bin",
            "rpi-firmware/start_cd.elf",
            "rpi-firmware/fixup_cd.dat",
            "rpi-firmware/config.txt",
            "rpi-firmware/cmdline.txt",
            "zImage"
        }
        file overlays {
            image = "rpi-firmware/overlays"
        }
    }

    size = 32M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
        offset = 1M
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
        size = 96M
    }
}
